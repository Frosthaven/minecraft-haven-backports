modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Frosthaven/minecraft-haven-backports/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
enumExtensions="META-INF/enumextensions.json"
description='''
Blocks, items and recipes from newer Minecraft versions, backported to 1.21.1 for the Haven pack with Mojang's own
textures, models, recipes, loot and properties. Required on both sides.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"
